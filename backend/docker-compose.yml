services:
  db:
    image: postgres:16-alpine
    container_name: unimate-db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - unimate-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  unimate-pgdata: